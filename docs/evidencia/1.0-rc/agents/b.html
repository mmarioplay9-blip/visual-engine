<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Halo Foundry, estudio de cerámica de autor.">
  <title>HALO FOUNDRY — Cerámica de autor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eee7db;
      color: #26231d;
      font-family: system-ui, sans-serif;
    }
    .landing {
      display: grid;
      grid-template-columns: minmax(0, 46fr) minmax(0, 54fr);
      min-height: 100svh;
    }
    .editorial {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
      padding: 40px clamp(32px, 5vw, 92px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .22em;
    }
    .brand::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 1px solid currentColor;
      border-radius: 50%;
      box-shadow: inset -3px -2px #96705b;
    }
    h1 {
      margin: 0;
      font: 400 clamp(54px, 6.5vw, 112px)/.96 Georgia, serif;
      letter-spacing: -.065em;
    }
    .intro p {
      margin: 26px 0 0;
      max-width: 36ch;
      font-size: 17px;
      line-height: 1.55;
    }
    dl {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 0;
      border-top: 1px solid #ab9e8d;
      padding-top: 17px;
    }
    dt {
      color: #695447;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    dd { margin: 6px 0 0; font-size: 14px; }
    .scene {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      margin: 0;
      min-height: 460px;
      background:
        radial-gradient(ellipse at 39% 28%, #645046, transparent 66%),
        linear-gradient(145deg, #312721, #1b1816 78%);
    }
    .halo {
      position: absolute;
      width: 75%;
      aspect-ratio: 1;
      border: 1px solid #c58c6e70;
      border-radius: 50%;
      transform: translateY(-7%);
    }
    .shadow {
      position: absolute;
      top: 72%;
      left: 25%;
      width: 64%;
      height: 14%;
      border-radius: 50%;
      background: radial-gradient(ellipse, #110d0c 5%, transparent 69%);
      transform: rotate(-5deg);
    }
    .vessel {
      position: relative;
      width: min(49%, 390px);
      aspect-ratio: 1.04;
      transform: translateY(7%);
    }
    .clay {
      position: absolute;
      inset: 15% 0 0;
      border-radius: 43% 44% 46% 46% / 29% 29% 59% 61%;
      background:
        radial-gradient(ellipse at 25% 11%, #f0b594aa, transparent 53%),
        repeating-radial-gradient(ellipse at 48% -145%, transparent 0 6px, #3d1b142e 7px, #ffdbb725 8px, transparent 10px),
        linear-gradient(105deg, #a75b3d, #b97250 26%, #985338 55%, #51261d 88%);
      box-shadow: inset -9px -17px 35px #371c17aa, inset 4px 2px 5px #f1b08b80;
    }
    .mouth {
      position: absolute;
      inset: 6% 23% auto;
      height: 22%;
      border-radius: 50%;
      background: linear-gradient(145deg, #dea37a, #a0583f 62%, #cf8b64);
      box-shadow: 1px 5px 9px #612f22a0;
    }
    .mouth::after {
      content: "";
      position: absolute;
      inset: 10% 4% 14%;
      border-radius: inherit;
      background: radial-gradient(ellipse at 63% 96%, #834a33, #341f19 64%, #221714);
    }
    @media (max-width: 760px) {
      .landing { grid-template-columns: 1fr; }
      .editorial { padding: 28px 24px; }
      .scene { min-height: 0; aspect-ratio: 1.08; }
    }
  </style>
</head>
<body>
  <main class="landing">
    <section class="editorial" aria-labelledby="titulo">
      <header class="brand">HALO FOUNDRY</header>
      <div class="intro">
        <h1 id="titulo">La forma<br>del fuego</h1>
        <p>Somos un estudio de cerámica de autor. Trabajamos el barro a mano y dejamos que el esmalte y el fuego definan el acabado de cada pieza.</p>
      </div>
      <dl aria-label="Datos del estudio">
        <div><dt>Materia</dt><dd>Barro esmaltado</dd></div>
        <div><dt>Proceso</dt><dd>Modelado a mano</dd></div>
        <div><dt>Producción</dt><dd>Series cortas</dd></div>
      </dl>
    </section>
    <figure class="scene" role="img" aria-label="Ilustración de una vasija de barro rojizo iluminada de lado, enmarcada por un halo.">
      <div class="halo" aria-hidden="true"></div>
      <div class="shadow" aria-hidden="true"></div>
      <div class="vessel" aria-hidden="true">
        <div class="clay"></div>
        <div class="mouth"></div>
      </div>
    </figure>
  </main>
</body>
</html>
