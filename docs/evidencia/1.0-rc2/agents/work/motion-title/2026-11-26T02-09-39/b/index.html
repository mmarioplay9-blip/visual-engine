<script>
  const canvas = document.querySelector('canvas');
  const context = canvas.getContext('2d');
  const grain = context.createImageData(canvas.width, canvas.height);
  let seed = 271828;
  // A fixed seed keeps the printed grain still and reproducible.
  for (let pixel = 0; pixel < grain.data.length; pixel += 4) {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    const shade = seed >>> 24;
    grain.data[pixel] = shade;
    grain.data[pixel + 1] = shade;
    grain.data[pixel + 2] = shade;
    grain.data[pixel + 3] = 22;
  }
  context.putImageData(grain, 0, 0);
</script>
