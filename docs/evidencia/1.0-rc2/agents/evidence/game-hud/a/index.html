<script>
"use strict";
const ctx = document.querySelector("canvas").getContext("2d");
ctx.scale(1280 / 1392, 720 / 752);
let seed = 491327;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
function gradient(x0, y0, x1, y1, stops) {
  const paint = ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([at, color]) => paint.addColorStop(at, color));
  return paint;
}
function shape(d, paint) {
  ctx.fillStyle = paint;
  ctx.fill(new Path2D(d));
}
function polygon(points, paint) {
  ctx.beginPath();
  points.forEach(([x,y], i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y));
  ctx.closePath();
  ctx.fillStyle = paint;
  ctx.fill();
}
function tint(rgb, shift, alpha = 1) {
  return 'rgba(' + rgb.map(value => Math.max(0, Math.min(255, value + shift))).join(',') + ',' + alpha + ')';
}
function fill(paint) {
  ctx.fillStyle = paint;
  ctx.fillRect(0,0,1392,752);
}

// Twilight and layered cloud noise, generated from independent seeded grids.
fill(gradient(380,0,485,427,[[0,"#242932"],[.39,"#39383d"],[.66,"#574649"],[.83,"#343944"],[1,"#303844"]]));
const cloud = document.createElement("canvas");
cloud.width = 696;
cloud.height = 220;
const cloudCtx = cloud.getContext("2d");
const cloudPixels = cloudCtx.createImageData(696,220);
function noiseGrid(width, height) {
  const samples = Array.from({length: width * height}, random);
  return (x,y) => {
    const column = Math.floor(x), row = Math.floor(y);
    const u = x - column, v = y - row;
    const a = u*u*(3-2*u), b = v*v*(3-2*v);
    const index = row * width + column;
    return (samples[index]*(1-a)+samples[index+1]*a)*(1-b) +
      (samples[index+width]*(1-a)+samples[index+width+1]*a)*b;
  };
}
const coarse = noiseGrid(34,34), fine = noiseGrid(70,70);
for (let y = 0; y < 220; y++) {
  for (let x = 0; x < 696; x++) {
    const bend = y + Math.sin(x / 116) * 11 + x * .075;
    const density = coarse(x/26, (bend+12)/12)*.72 + fine(x/12,(bend+12)/5)*.28;
    const position = (y*696+x)*4;
    cloudPixels.data[position] = 19;
    cloudPixels.data[position+1] = 21;
    cloudPixels.data[position+2] = 28;
    cloudPixels.data[position+3] = Math.max(0,(density-.43)*218) * (1-y/230);
  }
}
cloudCtx.putImageData(cloudPixels,0,0);
ctx.drawImage(cloud,0,0,1392,440);

// Main valley. The floor widens forward along both talus slopes.

// Rock faces use irregular vertical facets, bedding seams, and finer chips.
function cliff(outline, rim, bottom, rgb, step, depth) {
  const boundary = new Path2D(outline);
  ctx.save();
  ctx.clip(boundary);
  const left = rim[0][0], right = rim[rim.length-1][0];
  const top = Math.min(...rim.map(point => point[1]));
  fill(gradient(left,top,right,top+depth,[[0,tint(rgb,11)],[.47,tint(rgb,0)],[1,tint(rgb,-9)]]));
  function edge(x) {
    for (let i = 1; i < rim.length; i++) {
      const [rightX,rightY] = rim[i], [leftX,leftY] = rim[i-1];
      if (x <= rightX) return leftY + (rightY-leftY)*(x-leftX)/(rightX-leftX);
    }
    return rim[rim.length-1][1];
  }
  for (let x = left-12; x < right+15;) {
    const width = step * (.35 + random()*1.25);
    const y = edge(x) - random()*9;
    const lean = (random()-.42)*step*1.4;
    const end = Math.min(bottom+30,y+depth*(.78+random()*.8));
    const mid = y+(end-y)*(.40+random()*.23);
    const shift = Math.floor((random()-.52)*23);
    polygon([[x,y],[x+width*.86,y-3],[x+width+lean*.65,mid],[x+width*.66+lean,end],
      [x+lean*.8,end+3],[x+lean*.30,mid]],tint(rgb,shift));
    polygon([[x+width*.82,y],[x+width,y+3],[x+width+lean*.65,mid],[x+width*.66+lean,end],
      [x+width*.49+lean,end-12],[x+width*.76+lean*.65,mid-11]],tint(rgb,shift-11,.86));
    polygon([[x+width*.12,y+8],[x+width*.32,y+4],[x+width*.18+lean*.3,mid],
      [x+width*.27+lean*.8,end-8],[x+lean*.8,end],[x+lean*.3,mid]],tint(rgb,shift+10,.52));
    for(let i = 0; i < 8; i++) {
      const chipY = y+random()*(end-y), chipX = x+random()*width+lean*(chipY-y)/(end-y);
      polygon([[chipX,chipY],[chipX+width*.6,chipY-2],[chipX+width*.35,chipY+3],
        [chipX-2,chipY+4]],tint(rgb,shift-14,.23));
    }
    x += width;
  }
  for (let band=0; band<8; band++) {
    const offset = band*band*2.2+3;
    ctx.beginPath();
    rim.forEach(([x,y], i) => {
      const layerY = y+offset + 3*Math.sin(x/43+band);
      if (i === 0) ctx.moveTo(x-8,layerY);
      else ctx.lineTo(x,layerY);
    });
    ctx.strokeStyle = tint(rgb,band<3?-14:-10,band<3?.48:.24);
    ctx.lineWidth = band<3 ? 2.4 : 1.1;
    ctx.stroke();
  }
  ctx.restore();
}

// Broken ledges closer to the camera.
function ledge(top, wall, rim, base, color, spacing, depth, cap) {
  cliff(wall,rim,base,color,spacing,depth);
  const surface = new Path2D(top);
  ctx.save();
  ctx.clip(surface);
  const left = rim[0][0], right = rim[rim.length-1][0];
  const high = Math.min(...rim.map(point => point[1]));
  fill(gradient(left,high-52,right,high+42,[[0,cap],[.64,cap],[1,tint(color,2)]]));
  for(let i=0;i<230;i++) {
    const x=left-30+random()*(right-left+60), y=high-82+random()*162;
    const width=2+Math.pow(random(),2)*41;
    polygon([[x,y],[x+width*.52,y+width*.05],[x+width,y+width*.39],
      [x+width*.36,y+width*.28]],i%2 ? "#100c0c33" : "#87716321");
  }
  ctx.restore();
}

shape("M0 548Q85 579 132 591L201 603 277 625 349 628 420 649 499 660 565 697 632 752H0Z",

  gradient(1245,553,1277,752,[[0,"#372923"],[.57,"#51392c"],[1,"#35251e"]]));
ledge("M1289 554L1324 532 1356 525 1392 504V552L1341 564 1306 572Z",
  "M1296 553L1326 552 1355 542 1392 530V752H1315L1296 714 1286 654Z",
  [[1286,649],[1296,553],[1326,552],[1355,542],[1392,530]],752,[18,15,16],26,195,"#292221");

// Scree and scrub are placed by depth, with the nearest silhouettes painted last.
const debris = [];
for(let i=0;i<735;i++) {
  const x = random()*1392, y = 439 + Math.pow(random(),.86)*319;
  const center = 693 + (y-500)*.25;
  const near = (y-414)/338;
  const extent = 60 + Math.pow(near,1.17)*721;
  const onSand = Math.abs(x-center)<extent ||
    (x<367 && y>561+x*.21) || (x>915 && x<1291 && y>747-(x-915)*.45);
  if(onSand) debris.push([x,y,near]);
}
function rock(x,y,w,h) {
  polygon([[x-w*.66,y],[x+w*.28,y-h*.16],[x+w*.88,y+h*.16],[x+w*.40,y+h*.55],[x-w*.34,y+h*.33]],"#150f1087");
  polygon([[x-w*.51,y],[x-w*.34,y-h*.52],[x-w*.12,y-h*.87],[x+w*.20,y-h],[x+w*.41,y-h*.56],[x+w*.55,y-h*.14],[x+w*.17,y+h*.07]],"#211c1b");
  polygon([[x-w*.51,y],[x-w*.34,y-h*.52],[x-w*.12,y-h*.87],[x+w*.20,y-h],[x+w*.13,y-h*.55],[x-w*.18,y-h*.14]],"#3b3330");
  polygon([[x-w*.18,y-h*.14],[x+w*.13,y-h*.55],[x+w*.41,y-h*.56],[x+w*.55,y-h*.14],[x+w*.17,y+h*.07]],"#282322");
}
function shrub(x,y,r) {
  ctx.beginPath();
  ctx.ellipse(x+r*.1,y+r*.15,r*1.25,r*.32,.09,0,Math.PI*2);
  ctx.fillStyle="#19131183";
  ctx.fill();
  for(let i=0;i<19;i++) {
    const spread = (random()-.5)*2, height = .26+random()*.98;
    ctx.beginPath();
    ctx.moveTo(x+(random()-.5)*r*.45,y);
    ctx.quadraticCurveTo(x+spread*r*.33,y-r*height*.57,x+spread*r,y-r*height);
    ctx.strokeStyle=tint([31,32,24],Math.floor(random()*16)-9,.84);
    ctx.lineWidth=.4+r*.06;
    ctx.stroke();
  }
}
debris.push([578,683,.94],[676,567,.53],[935,616,.67],[1034,653,.73],[1230,727,.95]);
debris.sort((a,b)=>a[1]-b[1]);
for(const [x,y,near] of debris) {
  const extent = Math.pow(near,1.65)*(2+Math.pow(random(),3)*22)+.8;
  if(random()<.36) shrub(x,y,extent*.77);
  else rock(x,y,extent*1.25,extent*(.27+random()*.44));
}
rock(587,680,139,38);
rock(650,559,45,20);
rock(1156,741,77,26);
shrub(160,752,63);
shrub(839,749,28);
shrub(936,714,22);

// Low frequency mottling and fine grain blend the facets into the atmosphere.
const landscape = ctx.getImageData(0,0,1280,720);
const broadGrain = noiseGrid(46,41), fineGrain = noiseGrid(181,106);
for(let y=0;y<720;y++) {
  for(let x=0;x<1280;x++) {
    const index=(y*1280+x)*4;
    const roughness=(broadGrain(x/31,y/19)-.5)*8+(fineGrain(x/8,y/7)-.5)*5+(random()-.5)*4;
    const weight=.41+.59*y/720;
    for(let channel=0;channel<3;channel++) landscape.data[index+channel]+=roughness*weight;
  }
}
ctx.putImageData(landscape,0,0);
fill(gradient(0,315,0,752,[[0,"#06040800"],[1,"#05030432"]]));
const vignette = ctx.createRadialGradient(695,349,150,695,357,782);
vignette.addColorStop(0,"#10101700");
vignette.addColorStop(.44,"#07060920");
vignette.addColorStop(.74,"#05040558");
vignette.addColorStop(1,"#030203bf");
fill(vignette);
