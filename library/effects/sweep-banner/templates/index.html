<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sweep Banner · Visual Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="--bg: {{bg}}; --ink: {{ink}}; --accent: {{accent}}">
  <div class="page">
    <article class="banner">
      <div class="aurora" aria-hidden="true"></div>
      <div class="shine" aria-hidden="true"></div>
      <div class="sparkles" aria-hidden="true">
        <i style="--x: 14%; --y: 22%; --d: 0s"></i>
        <i style="--x: 78%; --y: 34%; --d: 1.1s"></i>
        <i style="--x: 62%; --y: 74%; --d: 2.2s"></i>
        <i style="--x: 26%; --y: 66%; --d: 3.1s"></i>
      </div>

      <header class="head">
        <span class="chip">VE · PREMIUM</span>
        <span class="meta">01 / BANNER</span>
      </header>

      <div class="copy">
        <h1>{{title}}</h1>
        <p>{{subtitle}}</p>
      </div>

      <footer class="foot">
        <svg viewBox="0 0 320 60" class="trace" aria-hidden="true">
          <path class="area" d="M0 48 C40 46 52 20 88 24 S132 44 164 36 208 6 240 14 296 30 320 8 V60 H0 Z" />
          <path class="line" d="M0 48 C40 46 52 20 88 24 S132 44 164 36 208 6 240 14 296 30 320 8" />
        </svg>
        <div class="stats">
          <div><b>+38%</b><span>retención</span></div>
          <div><b>1</b><span>solo bloque</span></div>
        </div>
      </footer>
    </article>
  </div>
  <script type="module" src="effect.js"></script>
</body>
</html>
