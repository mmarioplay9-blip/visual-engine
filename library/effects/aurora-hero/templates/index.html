<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aurora Hero · Visual Engine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="--bg: {{bg}}; --accent: {{accent}}; --accent-2: {{accent2}}; --ink: {{ink}}">
  <canvas id="aurora" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="hero">
    <p class="eyebrow"><span class="dot"></span>{{eyebrow}}</p>
    <h1 class="title">{{title}}</h1>
    <p class="lead">{{lead}}</p>
    <div class="actions">
      <a class="btn" href="#proceso">{{cta}}</a>
      <span class="hint">mueve el cursor</span>
    </div>
    <div class="meta" id="proceso">
      <span>REF → CAPTURA → Δ MEDIDO</span>
      <span class="bar"><i></i></span>
    </div>
  </main>

  <script type="module" src="effect.js"></script>
</body>
</html>
