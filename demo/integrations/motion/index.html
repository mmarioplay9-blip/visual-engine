<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Motion · Visual Engine</title>
<style>
  :root { color-scheme:dark; }
  *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
  body{background:#05070d;color:#eef8ff;font-family:ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center}
  main{padding:6vw;width:100%;max-width:1100px}
  .kicker{font:600 11px ui-monospace,monospace;color:#ffb454;letter-spacing:.16em}
  h1{font-size:clamp(38px,7vw,84px);letter-spacing:-.045em;line-height:.96;margin:14px 0 26px;max-width:13ch}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px}
  .card{border:1px solid #223442;border-radius:14px;padding:18px;background:linear-gradient(145deg,#0c1721,#081019);opacity:0}
  .card b{display:block;font-size:22px;color:#12e0c8;margin-bottom:6px}
  .card span{font-size:12px;color:#9ab4c5;line-height:1.5}
  .bar{height:2px;background:linear-gradient(90deg,#12e0c8,#ffb454);width:0;margin-top:14px}
  @media(max-width:700px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="kicker" data-item>MOTION · SPRINGS REALES</div>
  <h1 data-item>Entradas que se sienten físicas.</h1>
  <div class="cards">
    <div class="card" data-card><b>01</b><span>Spring con amortiguación, no una curva inventada.</span><div class="bar"></div></div>
    <div class="card" data-card><b>02</b><span>Stagger calculado por el motor de animación.</span><div class="bar"></div></div>
    <div class="card" data-card><b>03</b><span>Respeta reduced-motion y limpia controles.</span><div class="bar"></div></div>
  </div>
</main>
<script type="module" src="./bundle.js"></script>
</body>
</html>
