<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GSAP · Visual Engine</title>
<style>
  :root { color-scheme: dark; --bg:#050a10; --ink:#f2f8ff; --accent:#12e0c8; }
  * { box-sizing:border-box; } html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(80% 80% at 30% 10%,#0d2b31,var(--bg));color:var(--ink);font-family:ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center}
  main{padding:6vw;width:100%}
  .kicker{font:600 11px ui-monospace,monospace;letter-spacing:.16em;color:var(--accent)}
  h1{font-size:clamp(38px,8vw,92px);line-height:.94;letter-spacing:-.045em;margin:14px 0 22px;max-width:12ch}
  h1 span{display:inline-block;will-change:transform,opacity}
  p{max-width:46ch;color:#b7cedd;line-height:1.55;font-size:15px}
  .row{display:flex;gap:10px;margin-top:24px}
  .chip{border:1px solid #254854;border-radius:999px;padding:7px 12px;font:11px ui-monospace,monospace;color:#bfe9e4}
  .line{height:1px;width:min(480px,70vw);background:linear-gradient(90deg,var(--accent),transparent);margin-top:22px;transform-origin:left}
</style>
</head>
<body>
<main>
  <div class="kicker" data-layer>GSAP · TIMELINE REAL</div>
  <h1 data-split data-text="Movimiento con intención."></h1>
  <p data-layer>Una secuencia medida: entrada escalonada, línea que se dibuja y capas que aparecen cuando aportan.</p>
  <div class="row" data-layer><span class="chip">gsap.timeline</span><span class="chip">sin Club GSAP</span></div>
  <div class="line" data-line></div>
</main>
<script src="/node_modules/gsap/dist/gsap.min.js"></script>
<script>
  const h1 = document.querySelector('[data-split]');
  for (const ch of h1.dataset.text) {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00a0' : ch;
    h1.appendChild(s);
  }
  const tl = gsap.timeline({ defaults: { ease: 'expo.out' } });
  tl.from('.kicker', { opacity: 0, y: 12, duration: .6 })
    .from('h1 span', { yPercent: 120, opacity: 0, rotate: 3, duration: .9, stagger: .022 }, .1)
    .from('p', { opacity: 0, y: 16, duration: .7 }, .45)
    .from('.row .chip', { opacity: 0, y: 10, duration: .5, stagger: .08 }, .55)
    .fromTo('.line', { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: 'power3.inOut' }, .4);
  window.__veReady = true;
  window.__veGsap = { duration: tl.duration(), children: tl.getChildren().length };
</script>
</body>
</html>
